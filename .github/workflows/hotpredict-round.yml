name: hotpredict-round

on:
  schedule:
    - cron: '7 * * * *'   # UTC 每小时第7分 = 北京时间每小时7分（避开整点——GitHub 文档明示 start of every hour 高负载会直接丢弃 scheduled job；同时本行变更=强制重激活 schedule 注册）。改 '*/5 * * * *' 即 5 分钟一轮（最短间隔）
  workflow_dispatch:        # 手动触发（切流前验证用；本机 HotPredict-Dispatch 每小时兜底也走它）

permissions:
  contents: write           # 轮后提交 states/日报/看板（2026-10-04 脱离腾讯云：状态改存 GitHub）

concurrency:
  group: hotpredict-round
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      # 状态存储①：热点.db → actions/cache（键 hpdb-<run_id> 每轮存新份，restore-keys 取最近一份；
      # 超仓缓存上限 10GB 时 LRU 淘汰旧份、最新份始终保留）。全失时 gh_round 回落仓库种子 data/热点.db.gz。
      - name: Restore db cache
        uses: actions/cache@v4
        with:
          path: 热点.db
          key: hpdb-${{ github.run_id }}
          restore-keys: |
            hpdb-

      # 状态存储②：config → Actions secret（= 本地 config.yaml 全文）。
      # 改配置后更新：gh secret set CONFIG_YAML -R zxg00544-crypto/hotpredict < config.yaml
      # 状态存储③：states/日报/看板 → 仓库提交（下方 Commit 步）。已无腾讯云：无 COS/SCF 任何依赖。
      - name: Run round (config←secret, db←cache, 状态落仓库根)
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: python gh_round.py

      - name: Commit states/日报/看板
        run: |
          git config user.name "hotpredict-actions"
          git config user.email "hotpredict-actions@users.noreply.github.com"
          # 本轮产出先落临时目录：旧写法 git pull --rebase 撞同名状态文件必冲突（2026-10-04 21:14 run 61 失败根因）
          STATE_TMP="$(mktemp -d)"
          mkdir -p "$STATE_TMP/states" "$STATE_TMP/日报" "$STATE_TMP/看板" "$STATE_TMP/大V"
          cp -f -- states/*.json "$STATE_TMP/states/" 2>/dev/null || true
          cp -rf -- 日报/. "$STATE_TMP/日报/" 2>/dev/null || true
          cp -rf -- 看板/. "$STATE_TMP/看板/" 2>/dev/null || true
          cp -rf -- 大V/. "$STATE_TMP/大V/" 2>/dev/null || true
          # 并发竞争改写法：取最新上游 -> 重放本轮状态 -> 直接推，不 rebase。失败重试 3 次，宁可后写覆盖不丢轮
          for i in 1 2 3; do
            git fetch origin
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp -f -- "$STATE_TMP"/states/*.json states/ 2>/dev/null || true
            cp -rf -- "$STATE_TMP"/日报/. 日报/ 2>/dev/null || true
            cp -rf -- "$STATE_TMP"/看板/. 看板/ 2>/dev/null || true
            cp -rf -- "$STATE_TMP"/大V/. 大V/ 2>/dev/null || true
            git add -f -- 日报 || true
            git add -f -- 看板 || true
            git add -f -- 大V || true
            if ls states/*.json >/dev/null 2>&1; then git add -f -- states/*.json; fi
            if git diff --cached --quiet; then
              echo "state already upstream, nothing to push"
              exit 0
            fi
            if ! git commit -m "轮次状态 ${{ github.run_id }}"; then
              echo "commit failed, retry $i"
              sleep $((i * 5))
              continue
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected (concurrent writer), retry $i"
            sleep $((i * 5))
          done
          echo "state push failed after 3 attempts"
          exit 1
